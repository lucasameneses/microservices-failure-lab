# Configurações básicas
server.port=8080
spring.application.name=service-a

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Métricas
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# OpenTelemetry/Jaeger
management.tracing.sampling.probability=1.0
otel.exporter.jaeger.endpoint=http://jaeger:14250
otel.service.name=${spring.application.name}

# Configuração alternativa OTLP (se necessário)
 management.otel.exporter.otlp.endpoint=http://jaeger:4317
 management.otel.traces.exporter=jaeger

# Logging para debug
logging.level.io.opentelemetry=DEBUG
logging.level.org.springframework.web=INFO

# Adicionar estas linhas
management.otel.propagators=tracecontext,b3
management.otel.http.instrumentation-type=otel