server.port=8080
spring.application.name=service-a

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.logging.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/logs

lab.downstream.url=${LAB_DOWNSTREAM_URL:http://localhost:8081}
lab.downstream.connect-timeout=1s
lab.downstream.read-timeout=3s
lab.cycle.max-depth=10
