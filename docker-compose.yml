version: '3.8'

services:
  service-a:
    build: ./services/service-a
    environment:
      SPRING_APPLICATION_NAME: service-a
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14250
      # OTLP alternativo:
#       OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8080:8080"
    networks:
      - failure-lab-net
    depends_on:
      jaeger:
        condition: service_started

  service-b:
    build: ./services/service-b
    environment:
      SPRING_APPLICATION_NAME: service-b
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14250
    ports:
      - "8081:8081"
    networks:
      - failure-lab-net
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - failure-lab-net

  grafana:
    image: grafana/grafana
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3000:3000"
    networks:
      - failure-lab-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "14250:14250"   # Jaeger gRPC
      - "14268:14268"   # Jaeger HTTP
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - failure-lab-net

networks:
  failure-lab-net:
    driver: bridge